name: 교육·인턴 및 성균관대 공지 감시

on:
  schedule:
    # 08:00 KST (23:00 UTC the previous day).
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "이메일 수신 테스트 알림 보내기"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: training-alert-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: macos-15
    env:
      SITE_GROUP: all
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund
      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 조회 로직 검증
        run: |
          node public-html.test.mjs
          node work24.test.mjs
          node linkareer.test.mjs
          node intern-sources.test.mjs
          node aict.test.mjs
          node work24-kdt.test.mjs

      - name: 무료 한국어 OCR 준비
        run: |
          command -v tesseract >/dev/null || brew install tesseract
          mkdir -p "$RUNNER_TEMP/linkareer-tessdata"
          for lang in kor eng; do
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/$lang.traineddata" -o "$RUNNER_TEMP/linkareer-tessdata/$lang.traineddata"
          done
          echo "LINKAREER_TESSDATA=$RUNNER_TEMP/linkareer-tessdata" >> "$GITHUB_ENV"

      - name: 사이트 확인
        id: monitor
        continue-on-error: true
        run: npm run check

      - name: 기준선 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node save-state.mjs

      - name: 새 모집 알림 생성
        if: steps.monitor.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "교육·인턴 및 성균관대 새 공지 알림 ($(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M'))" \
            --body-file alert.md \
            --assignee "${{ github.repository_owner }}"

      - name: 이메일 수신 테스트 알림 생성
        if: github.event_name == 'workflow_dispatch' && inputs.send_test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "[자동화 테스트] 교육·인턴 모집 알림" \
            --body "GitHub Actions 봇이 발송한 이메일 수신 테스트입니다. 새 공고가 발견된 것은 아닙니다." \
            --assignee "${{ github.repository_owner }}"

      - name: 사이트 오류 상태 반영
        if: steps.monitor.outcome == 'failure'
        run: exit 1
